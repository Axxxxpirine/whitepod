<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Ground shadow -->
  <rect x="8" y="8" width="52" height="52" fill="#1a1a2a" opacity="0.35"/>

  <!-- Base platform (circular-ish industrial pad) -->
  <rect x="10" y="10" width="44" height="44" rx="2" fill="#3a3a4e"/>
  <rect x="10" y="10" width="44" height="1" fill="#5a5a6e" opacity="0.6"/>
  <rect x="10" y="10" width="1" height="44" fill="#5a5a6e" opacity="0.4"/>
  <rect x="10" y="53" width="44" height="1" fill="#2a2a3e"/>
  <rect x="53" y="10" width="1" height="44" fill="#2a2a3e"/>

  <!-- Inner platform -->
  <rect x="13" y="13" width="38" height="38" fill="#2e2e42"/>

  <!-- Drill / extraction well (center) -->
  <!-- Outer ring -->
  <rect x="22" y="22" width="20" height="20" rx="2" fill="#4a4a5e"/>
  <rect x="23" y="23" width="18" height="18" rx="1" fill="#3a3a50"/>
  <!-- Mid ring -->
  <rect x="25" y="25" width="14" height="14" rx="1" fill="#2a2a40"/>
  <!-- Inner bore hole -->
  <rect x="28" y="28" width="8" height="8" fill="#1a1a2e"/>
  <rect x="29" y="29" width="6" height="6" fill="#101020"/>
  <!-- Core glow (energy/resource being extracted) -->
  <rect x="30" y="30" width="4" height="4" fill="#cc6a2a" opacity="0.8"/>
  <rect x="31" y="31" width="2" height="2" fill="#ffaa44" opacity="0.9"/>
  <rect x="31" y="31" width="1" height="1" fill="#ffdd88" opacity="0.7"/>

  <!-- Drill arm / mechanical arms extending from center (X pattern) -->
  <!-- Top-left arm -->
  <rect x="18" y="20" width="6" height="2" fill="#5a5a6e"/>
  <rect x="20" y="16" width="2" height="6" fill="#5a5a6e"/>
  <rect x="18" y="20" width="2" height="2" fill="#6a6a7e"/>
  <!-- Top-right arm -->
  <rect x="40" y="20" width="6" height="2" fill="#5a5a6e"/>
  <rect x="42" y="16" width="2" height="6" fill="#5a5a6e"/>
  <rect x="44" y="20" width="2" height="2" fill="#6a6a7e"/>
  <!-- Bottom-left arm -->
  <rect x="18" y="42" width="6" height="2" fill="#5a5a6e"/>
  <rect x="20" y="42" width="2" height="6" fill="#5a5a6e"/>
  <rect x="18" y="42" width="2" height="2" fill="#6a6a7e"/>
  <!-- Bottom-right arm -->
  <rect x="40" y="42" width="6" height="2" fill="#5a5a6e"/>
  <rect x="42" y="42" width="2" height="6" fill="#5a5a6e"/>
  <rect x="44" y="42" width="2" height="2" fill="#6a6a7e"/>

  <!-- Hydraulic pistons / support struts (diagonal accents) -->
  <rect x="16" y="16" width="3" height="1" fill="#6a6a7e" opacity="0.7"/>
  <rect x="16" y="16" width="1" height="3" fill="#6a6a7e" opacity="0.7"/>
  <rect x="45" y="16" width="3" height="1" fill="#6a6a7e" opacity="0.7"/>
  <rect x="47" y="16" width="1" height="3" fill="#6a6a7e" opacity="0.7"/>
  <rect x="16" y="47" width="3" height="1" fill="#6a6a7e" opacity="0.7"/>
  <rect x="16" y="45" width="1" height="3" fill="#6a6a7e" opacity="0.7"/>
  <rect x="45" y="47" width="3" height="1" fill="#6a6a7e" opacity="0.7"/>
  <rect x="47" y="45" width="1" height="3" fill="#6a6a7e" opacity="0.7"/>

  <!-- Output pipe (going right, resource output) -->
  <rect x="54" y="28" width="8" height="8" fill="#3a3a4e"/>
  <rect x="54" y="29" width="8" height="6" fill="#4a4a5e"/>
  <rect x="54" y="30" width="8" height="4" fill="#2e2e42"/>
  <!-- Pipe inner glow (resource flowing) -->
  <rect x="54" y="31" width="8" height="2" fill="#cc6a2a" opacity="0.5"/>
  <rect x="56" y="31" width="2" height="2" fill="#ffaa44" opacity="0.4"/>
  <!-- Pipe connector ring -->
  <rect x="53" y="28" width="2" height="8" fill="#5a5a6e"/>
  <rect x="53" y="28" width="2" height="1" fill="#6a6a7e"/>

  <!-- Input pipe (going left, possibly power input) -->
  <rect x="2" y="28" width="8" height="8" fill="#3a3a4e"/>
  <rect x="2" y="29" width="8" height="6" fill="#4a4a5e"/>
  <rect x="2" y="30" width="8" height="4" fill="#2e2e42"/>
  <!-- Pipe inner (power conduit - blue) -->
  <rect x="2" y="31" width="8" height="2" fill="#2a6acc" opacity="0.4"/>
  <rect x="4" y="31" width="2" height="2" fill="#4a8aee" opacity="0.3"/>
  <!-- Pipe connector ring -->
  <rect x="9" y="28" width="2" height="8" fill="#5a5a6e"/>
  <rect x="9" y="28" width="2" height="1" fill="#6a6a7e"/>

  <!-- Corner mounting bolts -->
  <rect x="11" y="11" width="2" height="2" fill="#5a5a6e"/>
  <rect x="11" y="11" width="1" height="1" fill="#7a7a8e" opacity="0.6"/>
  <rect x="51" y="11" width="2" height="2" fill="#5a5a6e"/>
  <rect x="52" y="11" width="1" height="1" fill="#7a7a8e" opacity="0.6"/>
  <rect x="11" y="51" width="2" height="2" fill="#5a5a6e"/>
  <rect x="11" y="52" width="1" height="1" fill="#7a7a8e" opacity="0.6"/>
  <rect x="51" y="51" width="2" height="2" fill="#5a5a6e"/>
  <rect x="52" y="52" width="1" height="1" fill="#7a7a8e" opacity="0.6"/>

  <!-- Status LEDs (near top edge) -->
  <rect x="16" y="14" width="2" height="2" fill="#3aeaa0" opacity="0.7"/>
  <rect x="16" y="14" width="1" height="1" fill="#aaffdd" opacity="0.5"/>
  <rect x="20" y="14" width="2" height="2" fill="#cc6a2a" opacity="0.7"/>
  <rect x="20" y="14" width="1" height="1" fill="#ffcc88" opacity="0.5"/>

  <!-- Rotating ring segments (animation hint - dashes around bore) -->
  <rect x="26" y="22" width="3" height="1" fill="#6a8acc" opacity="0.3"/>
  <rect x="35" y="22" width="3" height="1" fill="#6a8acc" opacity="0.3"/>
  <rect x="26" y="41" width="3" height="1" fill="#6a8acc" opacity="0.3"/>
  <rect x="35" y="41" width="3" height="1" fill="#6a8acc" opacity="0.3"/>
  <rect x="22" y="26" width="1" height="3" fill="#6a8acc" opacity="0.3"/>
  <rect x="22" y="35" width="1" height="3" fill="#6a8acc" opacity="0.3"/>
  <rect x="41" y="26" width="1" height="3" fill="#6a8acc" opacity="0.3"/>
  <rect x="41" y="35" width="1" height="3" fill="#6a8acc" opacity="0.3"/>

  <!-- Futuristic edge trim -->
  <rect x="10" y="10" width="44" height="1" fill="#4a7acc" opacity="0.15"/>
  <rect x="10" y="53" width="44" height="1" fill="#4a7acc" opacity="0.1"/>
</svg>