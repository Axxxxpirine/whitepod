<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Background transparent -->

  <!-- Panel frame / border (dark metallic) -->
  <rect x="4" y="4" width="56" height="56" rx="1" fill="#3a3a4a"/>

  <!-- Panel inner area (dark blue base) -->
  <rect x="6" y="6" width="52" height="52" fill="#1a2744"/>

  <!-- Solar cells - 4x4 grid with gaps -->
  <!-- Row 1 -->
  <rect x="8" y="8" width="11" height="11" fill="#2a4a8a"/>
  <rect x="21" y="8" width="11" height="11" fill="#2e5090"/>
  <rect x="34" y="8" width="11" height="11" fill="#2a4a8a"/>
  <rect x="47" y="8" width="11" height="11" fill="#2e5090"/>

  <!-- Row 2 -->
  <rect x="8" y="21" width="11" height="11" fill="#2e5090"/>
  <rect x="21" y="21" width="11" height="11" fill="#2a4a8a"/>
  <rect x="34" y="21" width="11" height="11" fill="#2e5090"/>
  <rect x="47" y="21" width="11" height="11" fill="#2a4a8a"/>

  <!-- Row 3 -->
  <rect x="8" y="34" width="11" height="11" fill="#2a4a8a"/>
  <rect x="21" y="34" width="11" height="11" fill="#2e5090"/>
  <rect x="34" y="34" width="11" height="11" fill="#2a4a8a"/>
  <rect x="47" y="34" width="11" height="11" fill="#2e5090"/>

  <!-- Row 4 -->
  <rect x="8" y="47" width="11" height="11" fill="#2e5090"/>
  <rect x="21" y="47" width="11" height="11" fill="#2a4a8a"/>
  <rect x="34" y="47" width="11" height="11" fill="#2e5090"/>
  <rect x="47" y="47" width="11" height="11" fill="#2a4a8a"/>

  <!-- Cell diagonal lines (light reflection) -->
  <!-- Row 1 -->
  <line x1="8" y1="8" x2="19" y2="19" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="21" y1="8" x2="32" y2="19" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="34" y1="8" x2="45" y2="19" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="47" y1="8" x2="58" y2="19" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <!-- Row 2 -->
  <line x1="8" y1="21" x2="19" y2="32" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="21" y1="21" x2="32" y2="32" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="34" y1="21" x2="45" y2="32" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="47" y1="21" x2="58" y2="32" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <!-- Row 3 -->
  <line x1="8" y1="34" x2="19" y2="45" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="21" y1="34" x2="32" y2="45" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="34" y1="34" x2="45" y2="45" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="47" y1="34" x2="58" y2="45" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <!-- Row 4 -->
  <line x1="8" y1="47" x2="19" y2="58" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="21" y1="47" x2="32" y2="58" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="34" y1="47" x2="45" y2="58" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>
  <line x1="47" y1="47" x2="58" y2="58" stroke="#4a7acc" stroke-width="1" opacity="0.4"/>

  <!-- Grid lines (metallic frame between cells) -->
  <!-- Vertical -->
  <rect x="19" y="6" width="2" height="52" fill="#4a4a5a"/>
  <rect x="32" y="6" width="2" height="52" fill="#4a4a5a"/>
  <rect x="45" y="6" width="2" height="52" fill="#4a4a5a"/>
  <!-- Horizontal -->
  <rect x="6" y="19" width="52" height="2" fill="#4a4a5a"/>
  <rect x="6" y="32" width="52" height="2" fill="#4a4a5a"/>
  <rect x="6" y="45" width="52" height="2" fill="#4a4a5a"/>

  <!-- Sun glare / highlight (top-left corner reflection) -->
  <rect x="9" y="9" width="4" height="2" fill="#7ab8ff" opacity="0.5"/>
  <rect x="9" y="9" width="2" height="4" fill="#7ab8ff" opacity="0.5"/>
  <rect x="9" y="9" width="1" height="1" fill="#ffffff" opacity="0.6"/>

  <!-- Subtle highlight on frame edges (top + left) -->
  <rect x="4" y="4" width="56" height="1" fill="#5a5a6a" opacity="0.7"/>
  <rect x="4" y="4" width="1" height="56" fill="#5a5a6a" opacity="0.7"/>

  <!-- Shadow on frame edges (bottom + right) -->
  <rect x="4" y="59" width="56" height="1" fill="#2a2a3a" opacity="0.7"/>
  <rect x="59" y="4" width="1" height="56" fill="#2a2a3a" opacity="0.7"/>
</svg>