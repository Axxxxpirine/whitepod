<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Ground shadow (larger, tower is tall so shadow spreads) -->
  <rect x="10" y="12" width="48" height="48" fill="#1a1a2a" opacity="0.3"/>

  <!-- Base footprint (octagonal-ish platform) -->
  <rect x="12" y="12" width="40" height="40" rx="2" fill="#3a3a4e"/>
  <rect x="12" y="12" width="40" height="1" fill="#5a5a6e" opacity="0.5"/>
  <rect x="12" y="12" width="1" height="40" fill="#5a5a6e" opacity="0.4"/>
  <rect x="12" y="51" width="40" height="1" fill="#2a2a3e"/>
  <rect x="51" y="12" width="1" height="40" fill="#2a2a3e"/>

  <!-- Observation deck floor (raised, lighter) -->
  <rect x="14" y="14" width="36" height="36" fill="#4a4a5e"/>
  <rect x="15" y="15" width="34" height="34" fill="#555570"/>

  <!-- Railing / parapet walls (top-down view shows as border) -->
  <!-- Top wall -->
  <rect x="14" y="14" width="36" height="3" fill="#4a4a5e"/>
  <rect x="14" y="14" width="36" height="1" fill="#6a6a80"/>
  <!-- Bottom wall -->
  <rect x="14" y="47" width="36" height="3" fill="#4a4a5e"/>
  <rect x="14" y="49" width="36" height="1" fill="#3a3a4e"/>
  <!-- Left wall -->
  <rect x="14" y="14" width="3" height="36" fill="#4a4a5e"/>
  <rect x="14" y="14" width="1" height="36" fill="#6a6a80"/>
  <!-- Right wall -->
  <rect x="47" y="14" width="3" height="36" fill="#4a4a5e"/>
  <rect x="49" y="14" width="1" height="36" fill="#3a3a4e"/>

  <!-- Railing posts (small dots along parapet) -->
  <!-- Top -->
  <rect x="18" y="14" width="2" height="2" fill="#5e5e74"/>
  <rect x="24" y="14" width="2" height="2" fill="#5e5e74"/>
  <rect x="30" y="14" width="2" height="2" fill="#5e5e74"/>
  <rect x="36" y="14" width="2" height="2" fill="#5e5e74"/>
  <rect x="42" y="14" width="2" height="2" fill="#5e5e74"/>
  <!-- Bottom -->
  <rect x="18" y="48" width="2" height="2" fill="#5e5e74"/>
  <rect x="24" y="48" width="2" height="2" fill="#5e5e74"/>
  <rect x="30" y="48" width="2" height="2" fill="#5e5e74"/>
  <rect x="36" y="48" width="2" height="2" fill="#5e5e74"/>
  <rect x="42" y="48" width="2" height="2" fill="#5e5e74"/>
  <!-- Left -->
  <rect x="14" y="18" width="2" height="2" fill="#5e5e74"/>
  <rect x="14" y="24" width="2" height="2" fill="#5e5e74"/>
  <rect x="14" y="30" width="2" height="2" fill="#5e5e74"/>
  <rect x="14" y="36" width="2" height="2" fill="#5e5e74"/>
  <rect x="14" y="42" width="2" height="2" fill="#5e5e74"/>
  <!-- Right -->
  <rect x="48" y="18" width="2" height="2" fill="#5e5e74"/>
  <rect x="48" y="24" width="2" height="2" fill="#5e5e74"/>
  <rect x="48" y="30" width="2" height="2" fill="#5e5e74"/>
  <rect x="48" y="36" width="2" height="2" fill="#5e5e74"/>
  <rect x="48" y="42" width="2" height="2" fill="#5e5e74"/>

  <!-- Central tower column (the support pillar seen from above) -->
  <rect x="26" y="26" width="12" height="12" rx="1" fill="#3e3e54"/>
  <rect x="27" y="27" width="10" height="10" fill="#35354c"/>
  <rect x="28" y="28" width="8" height="8" fill="#2e2e44"/>

  <!-- Sensor / scanner dish on top of tower (futuristic) -->
  <rect x="29" y="29" width="6" height="6" rx="1" fill="#3a4a5e"/>
  <rect x="30" y="30" width="4" height="4" fill="#2a3a4e"/>
  <!-- Scanner core (glowing) -->
  <rect x="31" y="31" width="2" height="2" fill="#4aeaa0" opacity="0.8"/>
  <rect x="31" y="31" width="1" height="1" fill="#aaffdd" opacity="0.7"/>

  <!-- Scanner sweep rings (circular radar effect) -->
  <!-- Ring 1 -->
  <rect x="27" y="31" width="2" height="1" fill="#4aeaa0" opacity="0.2"/>
  <rect x="35" y="31" width="2" height="1" fill="#4aeaa0" opacity="0.2"/>
  <rect x="31" y="27" width="1" height="2" fill="#4aeaa0" opacity="0.2"/>
  <rect x="31" y="35" width="1" height="2" fill="#4aeaa0" opacity="0.2"/>
  <!-- Ring 2 -->
  <rect x="22" y="31" width="3" height="1" fill="#4aeaa0" opacity="0.12"/>
  <rect x="39" y="31" width="3" height="1" fill="#4aeaa0" opacity="0.12"/>
  <rect x="31" y="22" width="1" height="3" fill="#4aeaa0" opacity="0.12"/>
  <rect x="31" y="39" width="1" height="3" fill="#4aeaa0" opacity="0.12"/>
  <!-- Ring 3 (faint, far) -->
  <rect x="17" y="31" width="3" height="1" fill="#4aeaa0" opacity="0.07"/>
  <rect x="44" y="31" width="3" height="1" fill="#4aeaa0" opacity="0.07"/>
  <rect x="31" y="17" width="1" height="3" fill="#4aeaa0" opacity="0.07"/>
  <rect x="31" y="44" width="1" height="3" fill="#4aeaa0" opacity="0.07"/>

  <!-- Diagonal scanner sweep lines -->
  <rect x="28" y="28" width="1" height="1" fill="#4aeaa0" opacity="0.15"/>
  <rect x="26" y="26" width="1" height="1" fill="#4aeaa0" opacity="0.1"/>
  <rect x="24" y="24" width="1" height="1" fill="#4aeaa0" opacity="0.06"/>
  <rect x="35" y="35" width="1" height="1" fill="#4aeaa0" opacity="0.15"/>
  <rect x="37" y="37" width="1" height="1" fill="#4aeaa0" opacity="0.1"/>
  <rect x="39" y="39" width="1" height="1" fill="#4aeaa0" opacity="0.06"/>
  <rect x="35" y="28" width="1" height="1" fill="#4aeaa0" opacity="0.15"/>
  <rect x="37" y="26" width="1" height="1" fill="#4aeaa0" opacity="0.1"/>
  <rect x="28" y="35" width="1" height="1" fill="#4aeaa0" opacity="0.15"/>
  <rect x="26" y="37" width="1" height="1" fill="#4aeaa0" opacity="0.1"/>

  <!-- Spotlight / searchlight (beam going top-right) -->
  <rect x="34" y="24" width="2" height="1" fill="#ffffcc" opacity="0.2"/>
  <rect x="36" y="22" width="3" height="1" fill="#ffffcc" opacity="0.15"/>
  <rect x="39" y="20" width="4" height="1" fill="#ffffcc" opacity="0.1"/>
  <rect x="43" y="18" width="5" height="1" fill="#ffffcc" opacity="0.06"/>

  <!-- Access hatch (stairway from below) -->
  <rect x="19" y="38" width="5" height="8" fill="#3a3a4e"/>
  <rect x="20" y="39" width="3" height="6" fill="#2a2a3e"/>
  <!-- Stair lines -->
  <rect x="20" y="40" width="3" height="1" fill="#3a3a4e" opacity="0.6"/>
  <rect x="20" y="42" width="3" height="1" fill="#3a3a4e" opacity="0.6"/>
  <rect x="20" y="44" width="3" height="1" fill="#3a3a4e" opacity="0.6"/>

  <!-- Status LEDs on parapet -->
  <rect x="20" y="15" width="2" height="1" fill="#3aeaa0" opacity="0.5"/>
  <rect x="32" y="15" width="2" height="1" fill="#3aeaa0" opacity="0.5"/>
  <rect x="44" y="15" width="2" height="1" fill="#3aeaa0" opacity="0.5"/>

  <!-- Corner accent lights -->
  <rect x="15" y="15" width="1" height="1" fill="#4aeaa0" opacity="0.4"/>
  <rect x="48" y="15" width="1" height="1" fill="#4aeaa0" opacity="0.4"/>
  <rect x="15" y="48" width="1" height="1" fill="#4aeaa0" opacity="0.4"/>
  <rect x="48" y="48" width="1" height="1" fill="#4aeaa0" opacity="0.4"/>

  <!-- Futuristic edge trim -->
  <rect x="12" y="12" width="40" height="1" fill="#4a7acc" opacity="0.15"/>
  <rect x="12" y="12" width="1" height="40" fill="#4a7acc" opacity="0.1"/>
</svg>